<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melåsberget Diskgolf — 3D course builder</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #8fb8d8; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; background: #1a2a3a; z-index: 20;
  }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 300px; max-height: 90vh; overflow-y: auto;
    background: rgba(20, 24, 20, 0.82); color: #eee; border-radius: 10px; padding: 14px;
    font-size: 13px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #panel h1 { font-size: 15px; margin: 0 0 4px; }
  #panel .sub { color: #aaa; margin: 0 0 12px; font-size: 12px; }
  .hole-row { border-top: 1px solid rgba(255,255,255,0.12); padding: 8px 0; }
  .hole-row strong { display: block; margin-bottom: 6px; }
  .place-btn {
    font-size: 12px; border: none; border-radius: 6px; padding: 5px 8px; margin: 0 6px 4px 0;
    cursor: pointer; color: #111; font-weight: 600;
  }
  .place-btn.tee { background: #2ecc71; }
  .place-btn.basket { background: #ff7f27; }
  .place-btn.start { background: #6ab0ff; }
  .place-btn.start { background: #6ab0ff; }
  .place-btn.armed { outline: 2px solid #fff; }
  .status { display: block; font-size: 11px; color: #bbb; margin-bottom: 4px; }
  #hint { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); color: #ffd166; font-size: 12px; min-height: 16px; }
  #actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #actions button {
    flex: 1; font-size: 12px; padding: 7px; border: none; border-radius: 6px; cursor: pointer;
    background: #4a6fa5; color: #fff; font-weight: 600;
  }
  #export-output {
    width: 100%; height: 140px; margin-top: 8px; font-family: ui-monospace, monospace; font-size: 11px;
    display: none; background: #0d1117; color: #9fe6a0; border: 1px solid #333; border-radius: 6px; padding: 6px;
  }
  #controls-help {
    position: fixed; bottom: 10px; left: 12px; color: #fff; font-size: 11px; opacity: 0.75;
    background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 6px; z-index: 10;
  }
</style>
</head>
<body>
<div id="loading">Loading satellite imagery… 0/0</div>
<div id="app"></div>

<div id="panel">
  <h1>Melåsberget disc golf — course builder</h1>
  <p class="sub">Real terrain + satellite imagery of Flotsvegen 5, Jømna. Click "place", then click the ground.</p>
  <div id="hint"></div>
  <div id="actions">
    <button id="export-btn">Copy placements (JSON)</button>
    <button id="fly-btn">Preview flythrough</button>
  </div>
  <textarea id="export-output" readonly></textarea>
</div>
<div id="controls-help">Drag to orbit · scroll to zoom · right-drag to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script>
window.ELEVATION = __ELEVATION_JSON__;
window.TILES = __TILES_JSON__;
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
