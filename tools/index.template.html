<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melåsberget Diskgolf — 3D course builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffb703'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23ff5a1f' stroke-width='3'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8fb8d8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diskgolf">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #8fb8d8; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; background: #1a2a3a; z-index: 20;
  }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 300px; max-width: calc(100vw - 24px);
    max-height: 90vh; overflow-y: auto; background: rgba(20, 24, 20, 0.82); color: #eee;
    border-radius: 10px; padding: 14px; font-size: 13px; z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #panel h1 { font-size: 15px; margin: 0; }
  #panel .sub { color: #aaa; margin: 0 0 12px; font-size: 12px; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel-toggle {
    background: none; border: none; color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
    padding: 4px 6px; flex-shrink: 0;
  }
  #panel.collapsed .panel-body, #scorecard.collapsed .panel-body { display: none; }
  #panel.collapsed, #scorecard.collapsed { padding-bottom: 10px; }
  .hole-row { border-top: 1px solid rgba(255,255,255,0.12); padding: 8px 0; }
  .hole-row strong { display: block; margin-bottom: 6px; }
  .place-btn {
    font-size: 12px; border: none; border-radius: 6px; padding: 5px 8px; margin: 0 6px 4px 0;
    cursor: pointer; color: #111; font-weight: 600;
  }
  .place-btn.tee { background: #2ecc71; }
  .place-btn.basket { background: #ff7f27; }
  .place-btn.start { background: #6ab0ff; }
  .place-btn.armed { outline: 2px solid #fff; }
  #hole-hud {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: none;
    background: rgba(10, 14, 10, 0.72); color: #fff; font-size: 15px; font-weight: 700;
    letter-spacing: 0.02em; padding: 8px 18px; border-radius: 8px; z-index: 10;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  #debug-hud {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%); display: none;
    background: rgba(0,0,0,0.6); color: #ffd166; font-size: 12px; font-family: ui-monospace, monospace;
    padding: 4px 10px; border-radius: 6px; z-index: 10;
  }
  .status { display: block; font-size: 11px; color: #bbb; margin-bottom: 4px; }
  #hint { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); color: #ffd166; font-size: 12px; min-height: 16px; }
  #actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #actions button {
    flex: 1; font-size: 12px; padding: 7px; border: none; border-radius: 6px; cursor: pointer;
    background: #4a6fa5; color: #fff; font-weight: 600;
  }
  #export-output {
    width: 100%; height: 140px; margin-top: 8px; font-family: ui-monospace, monospace; font-size: 11px;
    display: none; background: #0d1117; color: #9fe6a0; border: 1px solid #333; border-radius: 6px; padding: 6px;
  }
  #controls-help {
    position: fixed; bottom: 10px; left: 12px; color: #fff; font-size: 11px; opacity: 0.75;
    background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 6px; z-index: 10;
  }
  #scorecard {
    position: fixed; top: 12px; right: 12px; width: 340px; max-width: calc(100vw - 24px);
    max-height: 90vh; overflow-y: auto; background: rgba(20, 24, 20, 0.82); color: #eee;
    border-radius: 10px; padding: 14px; font-size: 12px; z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #scorecard h2 { font-size: 14px; margin: 0; }
  #scorecard .panel-body { margin-top: 8px; }
  #scorecard-table-wrap { overflow-x: auto; }
  #scorecard-table { border-collapse: collapse; width: 100%; }
  #scorecard-table th, #scorecard-table td {
    padding: 3px 5px; text-align: center; white-space: nowrap; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #scorecard-table th { font-weight: 600; color: #bbb; font-size: 10px; }
  #scorecard-table th .par-label { display: block; color: #ffd166; font-weight: 400; }
  #scorecard-table td:first-child, #scorecard-table th:first-child { text-align: left; }
  .score-input {
    width: 30px; background: #0d1117; color: #eee; border: 1px solid #333; border-radius: 4px;
    text-align: center; font-size: 12px; padding: 2px;
  }
  .remove-player-btn {
    background: none; border: none; color: #e06c75; cursor: pointer; font-size: 12px; padding: 0 2px;
  }
  #scorecard-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #player-name-input {
    flex: 1; min-width: 90px; background: #0d1117; color: #eee; border: 1px solid #333;
    border-radius: 6px; padding: 6px; font-size: 12px;
  }
  #scorecard-actions button {
    font-size: 12px; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer;
    background: #4a6fa5; color: #fff; font-weight: 600;
  }
  #clear-scores-btn { background: #7a3b3b; }

  /* Touch/mobile: bigger tap targets, and >=16px inputs so iOS Safari doesn't
     auto-zoom on focus. Panels default to collapsed on small screens (see app.js)
     so the 3D view isn't immediately covered by two full-height panels. */
  @media (max-width: 700px), (pointer: coarse) {
    .place-btn, #actions button, #scorecard-actions button, .panel-toggle {
      padding: 10px 12px; font-size: 14px; min-height: 40px;
    }
    .remove-player-btn { min-height: 32px; min-width: 32px; font-size: 15px; }
    #player-name-input, .score-input, #export-output { font-size: 16px; }
    .score-input { width: 34px; padding: 6px 2px; }
    /* #panel and #scorecard were each set to nearly-full viewport width but stayed
       anchored to their own top:12px -- on desktop's wide viewport that never
       collided (300px/340px fixed widths, opposite sides, plenty of gap), but full-
       width on a phone put both panels' headers at the exact same position, stacked
       directly on top of each other. Stack them vertically instead. */
    #panel, #scorecard { width: calc(100vw - 24px); left: 12px; right: auto; }
    #scorecard { top: 64px; }
    #hole-hud { font-size: 13px; padding: 6px 12px; }
    #debug-hud { top: 52px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="loading">Loading satellite imagery… 0/0</div>
<div id="app"></div>
<div id="hole-hud"></div>
<div id="debug-hud"></div>

<div id="panel">
  <div class="panel-header">
    <h1>Melåsberget disc golf — course builder</h1>
    <button class="panel-toggle" id="panel-toggle" aria-label="Toggle course panel">−</button>
  </div>
  <div class="panel-body" id="panel-body">
    <p class="sub">Real terrain + satellite imagery of Flotsvegen 5, Jømna. Tap "place", then tap the ground.</p>
    <div id="hint"></div>
    <div id="actions">
      <button id="export-btn">Copy placements (JSON)</button>
      <button id="fly-btn">Preview flythrough</button>
      <button id="reset-btn">Reset to defaults</button>
    </div>
    <textarea id="export-output" readonly></textarea>
  </div>
</div>
<div id="controls-help">Drag/1-finger to orbit · scroll/pinch to zoom · right-drag/2-finger to pan</div>

<div id="scorecard">
  <div class="panel-header">
    <h2>Scorecard</h2>
    <button class="panel-toggle" id="scorecard-toggle" aria-label="Toggle scorecard">−</button>
  </div>
  <div class="panel-body" id="scorecard-panel-body">
    <div id="scorecard-table-wrap">
      <table id="scorecard-table">
        <thead><tr id="scorecard-header"></tr></thead>
        <tbody id="scorecard-body"></tbody>
      </table>
    </div>
    <div id="scorecard-actions">
      <input id="player-name-input" type="text" placeholder="Player name" maxlength="24">
      <button id="add-player-btn">Add player</button>
      <button id="clear-scores-btn">Clear scores</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script>
window.ELEVATION = __ELEVATION_JSON__;
window.TILES = __TILES_JSON__;
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
